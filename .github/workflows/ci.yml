name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every OS YuBen supports (reliability plan W8: the process layer,
        # stdin prompts, UTF-8 and tree kills differ by OS and were only ever
        # run on Ubuntu). Each OS gets the floor declared in
        # backend/pyproject.toml and current stable.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        # No keychain on a CI runner — secrets.py falls back to a 0600 file.
        env:
          YUBEN_FORCE_FILE_SECRET: '1'
          YUBEN_DATA_DIR: ${{ runner.temp }}/yuben-data
        # -rs lists skipped tests, so an OS-gated test that never ran shows.
        run: python -m pytest -q -rs

      - name: Launcher starts on this OS
        # The launcher is what users run first on every OS; --help builds
        # every subcommand's parser without installing anything. Its Python
        # 3.9 grammar is checked by test_launcher.py.
        run: |
          python yuben.py --help
          python yuben.py smoke --help

  frontend:
    name: Frontend (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Both ends of the supported range from package.json engines. Pinning
        # the low end matters: a bare '20' silently floats to whatever the
        # runner ships, so the declared 20.19 floor would never actually be
        # exercised.
        node-version: ['20.19', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        # `npm run build` is `tsc -b && vite build` — typecheck is included.
        run: npm run build

  contracts:
    name: Contracts / fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate fixtures against the JSON schemas
        run: python contracts/validate_fixtures.py

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Audit Python dependencies
        working-directory: backend
        # Audits the *installed* set rather than `-r requirements.txt`: the
        # requirements are floating (`>=`), so what actually gets installed is
        # what we want checked, and it avoids pip-audit's isolated-resolution
        # path, which needs `ensurepip` and is brittle on some runners.
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r requirements.txt
          pip-audit

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm dependencies
        working-directory: frontend
        # `npm audit --audit-level=high` with an escape hatch: high/critical
        # advisories still fail, except ones reviewed and found unreachable in
        # this app, which carry a reason and a review date. A waiver that no
        # longer matches, or one past its date, fails too — see the script and
        # SECURITY.md § Dependency advisories.
        run: npm run audit
