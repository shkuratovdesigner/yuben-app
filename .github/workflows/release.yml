name: Release npx package
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm test
      - run: npm run pack:app
      - run: npm run test:package
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp "dist/npm/yuben-app-$VERSION.tgz" dist/yuben-app.tgz
          gh release create "v$VERSION" dist/yuben-app.tgz --target "$GITHUB_SHA" --title "YuBen $VERSION" --notes-file docs/npx-release.md
