<!-- YuBen play-mark. Same geometry as src/assets/brand/logo-mark.svg, re-fitted
     into a square viewBox centred on the shape's real bounding box
     (80.10 43.27 49.88 55.04) so it sits true in a browser tab. The box is kept
     tight — a favicon is read at 16px, where generous padding just makes the
     mark small. Solid #00809C holds up on both light and dark tab bars, so
     there is no theme variant to keep in sync. -->
